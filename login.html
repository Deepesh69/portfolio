<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Portfolio CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 80%);
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: rgba(19, 26, 43, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 1.25rem;
      background: var(--primary-glow);
      border: 2px solid var(--primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .login-default-hint {
      margin-top: 1.5rem;
      padding: 0.85rem;
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.25);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      color: var(--badge-text);
      text-align: center;
    }
    .login-default-hint code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.75rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      justify-content: center;
      width: 100%;
    }
    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>
<body class="dark-theme">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">💼</div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Sign in to manage your portfolio content</p>
      </div>

      <div id="login-alert" class="form-alert hidden" style="margin-bottom: 1.25rem;"></div>

      <form id="login-form" class="form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required value="admin" autocomplete="username" class="form-control" placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" class="form-control" placeholder="••••••••">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
          <span id="login-btn-text">Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        </button>
      </form>

      <div class="login-default-hint">
        Default credentials: <strong>admin</strong> / <code>admin123</code>
      </div>

      <a href="/" class="back-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Public Portfolio</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already authenticated
      try {
        const token = localStorage.getItem('admin_token');
        if (token) {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` },
            credentials: 'include'
          });
          if (res.ok) {
            const contentType = res.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
              const data = await res.json();
              if (data && data.authenticated) {
                window.location.replace('/admin');
                return;
              }
            }
          }
        }
      } catch (e) {}

      const form = document.getElementById('login-form');
      const alertEl = document.getElementById('login-alert');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = form.username.value.trim();
        const password = form.password.value;

        btn.disabled = true;
        btnText.textContent = 'Verifying...';
        alertEl.classList.add('hidden');

        try {
          let token = null;

          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            if (res.ok) {
              const data = await res.json();
              token = data.token;
            } else if (res.status === 401) {
              const data = await res.json();
              throw new Error(data.error || 'Invalid credentials');
            }
          } catch (netErr) {
            // API not reachable on static host / Vercel
          }

          // If server didn't respond or on static Vercel host, check credentials
          if (!token) {
            if (username === 'admin' && password === 'admin123') {
              token = 'admin_session_' + Date.now();
            } else {
              throw new Error('Invalid username or password');
            }
          }

          localStorage.setItem('admin_token', token);
          alertEl.textContent = 'Login successful! Redirecting...';
          alertEl.className = 'form-alert success';
          alertEl.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/admin';
          }, 500);

        } catch (err) {
          alertEl.textContent = err.message;
          alertEl.className = 'form-alert error';
          alertEl.classList.remove('hidden');
          btn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
